{"name":"Build APK","jobs":{"build":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"Organizar arquivos","run":"mkdir -p app/src/main/java/com/treinoff app/src/main/assets app/src/main/res/values\nplace(){ p=$(find . -name $1 -not -path './.git/*' -not -path './app/*' | head -1); case $p in '') echo FALTA: $1; exit 1;; esac; mv $p $2; }\nplace MainActivity.java app/src/main/java/com/treinoff/MainActivity.java\nplace AndroidManifest.xml app/src/main/AndroidManifest.xml\nplace index.html app/src/main/assets/index.html\nplace strings.xml app/src/main/res/values/strings.xml\ncat > settings.gradle <<'EOT'\npluginManagement {\n    repositories { google(); mavenCentral(); gradlePluginPortal() }\n}\ndependencyResolutionManagement {\n    repositories { google(); mavenCentral() }\n}\nrootProject.name = 'TreinoFF'\ninclude ':app'\nEOT\ncat > build.gradle <<'EOT'\nplugins {\n    id 'com.android.application' version '8.5.2' apply false\n}\nEOT\ncat > app/build.gradle <<'EOT'\nplugins {\n    id 'com.android.application'\n}\nandroid {\n    namespace 'com.treinoff'\n    compileSdk 34\n    defaultConfig {\n        applicationId 'com.treinoff.guia'\n        minSdk 24\n        targetSdk 34\n        versionCode 1\n        versionName '1.0'\n    }\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n}\nEOT\necho android.useAndroidX=false > gradle.properties\n"},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":17}},{"uses":"gradle/actions/setup-gradle@v4","with":{"gradle-version":8.7}},{"run":"gradle assembleDebug"},{"uses":"actions/upload-artifact@v4","with":{"name":"TreinoFF-apk","path":"app/build/outputs/apk/debug/app-debug.apk"}}]}},"on":{"workflow_dispatch":{},"push":{"branches":["main"]}}}
